<!doctype html>
<html lang="ckb" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="author" content="Las Khoshnaw" />
    <meta property="og:site_name" content="L-LEX" />
    <meta property="og:title" content="L-LEX — یاسا بدۆزەرەوە | Legal Article Search" />
    <title>L-LEX — یاسا بدۆزەرەوە | Legal Article Search</title>
    <script>
      // Stamp theme and locale before first paint to avoid a flash of the wrong
      // theme or text direction. Keys mirror src/lib/storage.ts ('laws:' + key,
      // JSON-encoded values) — read-only here.
      (() => {
        const read = (key) => {
          try {
            return JSON.parse(localStorage.getItem('laws:' + key));
          } catch {
            return null;
          }
        };
        const theme = read('theme');
        const dark =
          theme === 'dark' ||
          (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';

        const dirs = { ckb: 'rtl', ar: 'rtl', en: 'ltr' };
        const locale = read('locale');
        if (typeof locale === 'string' && dirs[locale]) {
          document.documentElement.lang = locale;
          document.documentElement.dir = dirs[locale];
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
